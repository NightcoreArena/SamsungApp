<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><title>Flix Home</title><link rel="stylesheet" href="style.css"></head>

 <div id="clock-group"><div id="clock" role="img" aria-label="Heure"></div><div id="date"></div><div id="weather" class="hidden"></div></div>
